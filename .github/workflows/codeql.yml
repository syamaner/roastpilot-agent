name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # D180 (#702, slice 3): docs-only pull requests skip CodeQL analysis (non-
  # required, best-effort work), mirroring the same trusted-base classifier
  # execution ci.yml uses. Every non-pull_request trigger (push to main,
  # schedule, workflow_dispatch) still analyzes unconditionally, because the
  # classifier returns FULL for every non-pull_request event.
  classify:
    name: Classify CI change
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Narrower than the workflow-level permissions: this job never touches
    # the CodeQL security-events surface.
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out trusted base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: .ci-gate-base
          persist-credentials: false

      - name: Classify pull-request change
        id: classify
        run: >-
          python3 .ci-gate-base/scripts/ci_change_classifier.py
          --event-name "${{ github.event_name }}"
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"

  analyze:
    name: "Analyze (${{ matrix.language }})"
    runs-on: ubuntu-latest
    needs: [classify]
    if: always() && !(needs.classify.result == 'success' && needs.classify.outputs.mode == 'docs-only')
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - python

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          config-file: ./.github/codeql/codeql-config.yml
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
