name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Run lint
        run: python -m ruff check .

      - name: Run format check
        run: python -m ruff format --check .

      - name: Run typecheck
        # --pythonpath is required here (and only here): the runner has no
        # ./.venv, so pyproject's venvPath/venv settings cannot resolve an
        # interpreter. Locally, plain `python -m pyright` is correct.
        run: python -m pyright --pythonpath "${pythonLocation}/bin/python"

      - name: Run tests
        run: python -m pytest

      - name: Run CLI smoke checks
        run: |
          roastpilot-agent --help
          roastpilot-agent --version
