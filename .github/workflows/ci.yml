name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main runs: every main commit must upload coverage so it
  # can serve as a Codecov base report for future PRs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"

      # The dev group installs coffee-roaster-mcp (the E9-S2 vertical slice
      # spawns it in mock-driver mode), which depends on sounddevice — its
      # import needs the PortAudio runtime even though mock mode never opens an
      # audio device. Without it the bootstrap-safe child fails to start.
      - name: Install system libraries (PortAudio for sounddevice)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Run lint
        run: python -m ruff check .

      - name: Run format check
        run: python -m ruff format --check .

      - name: Run typecheck
        # --pythonpath is required here (and only here): the runner has no
        # ./.venv, so pyproject's venvPath/venv settings cannot resolve an
        # interpreter. Locally, plain `python -m pyright` is correct.
        run: python -m pyright --pythonpath "${pythonLocation}/bin/python"

      - name: Run tests with coverage
        run: python -m pytest --cov=roastpilot_agent --cov-report=xml --cov-report=term-missing:skip-covered

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run CLI smoke checks
        run: |
          roastpilot-agent --help
          roastpilot-agent --version

  # The SPA (web/) lint + typecheck + unit/component tests on a normal runner.
  web:
    name: Web (lint + typecheck + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit + component tests
        run: npm run test

  # The D24 visual gate: the scripted toHaveScreenshot() snapshot suite, run
  # INSIDE the pinned Playwright Linux image so its pixels match the committed
  # baselines (which are generated in this same image). Local macOS/system-Chrome
  # pixels drift — they are for the /capture skill + ui-reviewer only, not this gate.
  #
  # The suite drives the REAL replay harness (E10-S1): one webServer is the agent
  # in `--replay <fixture> --step` mode (REST + SSE + the gated step routes), the
  # other is the built SPA proxying /api to it. So the container needs BOTH Python
  # (the agent) and Node (Playwright). Replay mode never spawns the MCP child, so
  # no libportaudio2 / sounddevice is needed here (unlike the Python `checks` job).
  web-snapshots:
    name: Web (Playwright snapshots)
    runs-on: ubuntu-latest
    needs: web
    container:
      # Pinned to the @playwright/test version in web/package.json — bump both together.
      image: mcr.microsoft.com/playwright:v1.55.1-noble
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Set up Python (for the replay-harness webServer)
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install the agent (replay harness — no MCP/audio needed)
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build SPA
        working-directory: web
        run: npm run build

      - name: Run snapshot + e2e suite
        working-directory: web
        # Two webServers (Playwright-managed): the agent in --replay --step mode +
        # the built SPA. The suite asserts DOM chrome (canvas masked) + the chart
        # data hook + the real-replay SSE smoke against committed Linux baselines.
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
