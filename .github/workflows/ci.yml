name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main runs: every main commit must upload coverage so it
  # can serve as a Codecov base report for future PRs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  classify:
    name: Classify CI change
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Check out diff repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pull-request base classifier authority
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-classifier-base
          fetch-depth: 1
          persist-credentials: false

      - name: Classify change
        id: classify
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python .ci-classifier-base/scripts/ci_change_classifier.py \
              --event-name "${{ github.event_name }}" \
              --base-sha "${{ github.event.pull_request.base.sha }}" \
              --head-sha "${{ github.event.pull_request.head.sha }}"
          else
            python scripts/ci_change_classifier.py \
              --event-name "${{ github.event_name }}" \
              --base-sha "${{ github.sha }}" \
              --head-sha "${{ github.sha }}"
          fi

  quality:
    name: Quality (lint, format, pyright, contract drift)
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.mode != 'docs-only'
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"

      # The dev group installs coffee-roaster-mcp (the E9-S2 vertical slice
      # spawns it in mock-driver mode), which depends on sounddevice — its
      # import needs the PortAudio runtime even though mock mode never opens an
      # audio device. Without it the bootstrap-safe child fails to start.
      - name: Install system libraries (PortAudio for sounddevice)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Run lint
        run: python -m ruff check .

      - name: Run format check
        run: python -m ruff format --check .

      - name: Run typecheck
        # --pythonpath is required here (and only here): the runner has no
        # ./.venv, so pyproject's venvPath/venv settings cannot resolve an
        # interpreter. Locally, plain `python -m pyright` is correct.
        run: python -m pyright --pythonpath "${pythonLocation}/bin/python"

      # Continuous server-drift auto-catch (#121): regenerate the SPA contract
      # surface from the real server models and fail if it differs from the
      # committed mirror. The in-sync pytest tests above already gate drift
      # in-process; this is the belt-and-braces `git diff` form the issue asks
      # for, with an explicit diff + "regenerate with X" hint on failure. It
      # restores the tree on exit (never leaves the fixtures dirty).
      #
      # `if: always()` (#237): the in-sync pytest tests fail FIRST on a real
      # drift, so under the default success() condition this dedicated gate — the
      # one carrying the developer-facing diff + "regenerate with X" hint, its
      # whole reason to exist over pytest alone — would be SKIPPED in exactly the
      # scenario it is for. Running it always surfaces the hint on a real drift
      # while leaving pytest's own in-process coverage of the in-sync tests intact
      # (the smaller change than reordering the step).
      - name: Contract-drift gate (regenerate-and-compare)
        if: always()
        run: python scripts/check_contract_drift.py

      - name: Run CLI smoke checks
        run: |
          roastpilot-agent --help
          roastpilot-agent --version

  pytest-ordinary:
    name: Python tests (ordinary, xdist)
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.mode != 'docs-only'
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"

      # The dev group installs coffee-roaster-mcp (the E9-S2 vertical slice
      # spawns it in mock-driver mode), which depends on sounddevice — its
      # import needs the PortAudio runtime even though mock mode never opens an
      # audio device. Without it the bootstrap-safe child fails to start.
      - name: Install system libraries (PortAudio for sounddevice)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Run ordinary tests with coverage
        env:
          COVERAGE_FILE: .coverage.ordinary
        run: python -m pytest -n 4 --dist worksteal -m "not serial and not stress" --ignore=tests/test_packaging.py --cov=roastpilot_agent --cov=scripts --cov=.agents/skills/capture-agent-usage/scripts --cov-report=

      - name: Upload ordinary coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ordinary
          path: .coverage.ordinary
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  pytest-serial:
    name: Python tests (serial)
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.mode != 'docs-only'
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"

      # The dev group installs coffee-roaster-mcp (the E9-S2 vertical slice
      # spawns it in mock-driver mode), which depends on sounddevice — its
      # import needs the PortAudio runtime even though mock mode never opens an
      # audio device. Without it the bootstrap-safe child fails to start.
      - name: Install system libraries (PortAudio for sounddevice)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Run serial tests with coverage
        env:
          COVERAGE_FILE: .coverage.serial
        run: python -m pytest -m "serial and not stress" --ignore=tests/test_packaging.py --cov=roastpilot_agent --cov=scripts --cov=.agents/skills/capture-agent-usage/scripts --cov-report=

      - name: Upload serial coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-serial
          path: .coverage.serial
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  pytest-stress:
    name: Python tests (stress ${{ matrix.case }})
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.mode != 'docs-only'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: opaque-event-boundary
            nodeid: tests/test_capture_agent_usage.py::test_codex_opaque_event_boundary_is_exact
          - case: opaque-total-accepts-exact
            nodeid: tests/test_capture_agent_usage.py::test_codex_opaque_total_boundary_accepts_exact_limit
          - case: opaque-total-rejects-one-over
            nodeid: tests/test_capture_agent_usage.py::test_codex_opaque_total_boundary_rejects_one_over
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"

      # The dev group installs coffee-roaster-mcp (the E9-S2 vertical slice
      # spawns it in mock-driver mode), which depends on sounddevice — its
      # import needs the PortAudio runtime even though mock mode never opens an
      # audio device. Without it the bootstrap-safe child fails to start.
      - name: Install system libraries (PortAudio for sounddevice)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Run stress test with coverage
        env:
          COVERAGE_FILE: .coverage.stress-${{ matrix.case }}
        run: python -m pytest "${{ matrix.nodeid }}" --cov=roastpilot_agent --cov=scripts --cov=.agents/skills/capture-agent-usage/scripts --cov-report=

      - name: Upload stress coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-stress-${{ matrix.case }}
          path: .coverage.stress-${{ matrix.case }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # E11-S1 (#137): build the real wheel (Node must be present so the
  # hatch_build.py hook can `npm ci && npm run build` web/dist and force-include
  # it) and prove the artifact in a CLEAN venv — install from the .whl only,
  # never `pip install -e .`, so this exercises the packaged-data path
  # (roastpilot_agent/_web_dist via importlib.resources), not the
  # source-checkout fallback the `checks` job's editable install always takes.
  package:
    name: Package (wheel build + clean-venv smoke)
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.mode != 'docs-only'
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"

      # The dev group installs coffee-roaster-mcp (the E9-S2 vertical slice
      # spawns it in mock-driver mode), which depends on sounddevice — its
      # import needs the PortAudio runtime even though mock mode never opens an
      # audio device. Without it the bootstrap-safe child fails to start.
      - name: Install system libraries (PortAudio for sounddevice)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Set up Node (for the SPA build hook)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Run packaging tests
        env:
          COVERAGE_FILE: .coverage.package
        run: python -m pytest tests/test_packaging.py --cov=roastpilot_agent --cov=scripts --cov=.agents/skills/capture-agent-usage/scripts --cov-report=

      - name: Upload packaging coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-package
          path: .coverage.package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/wheel-smoke-venv
          /tmp/wheel-smoke-venv/bin/python -m pip install --upgrade pip
          /tmp/wheel-smoke-venv/bin/python -m pip install dist/*.whl

      - name: CLI smoke (clean-venv install, no source checkout on the path)
        run: |
          /tmp/wheel-smoke-venv/bin/roastpilot-agent --help
          /tmp/wheel-smoke-venv/bin/roastpilot-agent --version

      - name: SPA-bundled smoke (replay mode, hardware-free, non-8000 port)
        # Proves the packaged SPA is actually served (not just present in the
        # wheel): --replay never spawns the MCP child, so this needs no
        # libportaudio2/sounddevice runtime. Binds a high port; 8000 is never
        # used in CI but the convention is kept for consistency with the
        # "never touch 8000" rule (a live hardware server may use it locally).
        run: |
          /tmp/wheel-smoke-venv/bin/roastpilot-agent \
            --replay tests/fixtures/replay/session-1 \
            --host 127.0.0.1 --port 18234 --speed 60 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:18234/api/health; then
              break
            fi
            sleep 0.5
          done
          curl -sf -o /dev/null http://127.0.0.1:18234/api/health
          index_html="$(curl -sf http://127.0.0.1:18234/)"
          echo "$index_html" | grep -q '<div id="root">' \
            || { echo "SPA index.html not served from the packaged wheel"; exit 1; }

  coverage:
    name: Coverage (combine + normalize + upload)
    runs-on: ubuntu-latest
    needs: [classify, pytest-ordinary, pytest-serial, pytest-stress, package]
    if: needs.classify.outputs.mode != 'docs-only'
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install coverage
        run: python -m pip install --upgrade pip && python -m pip install "coverage>=7.6"

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: .

      - name: Combine coverage data
        run: python -m coverage combine --keep .coverage.ordinary .coverage.serial .coverage.stress-opaque-event-boundary .coverage.stress-opaque-total-accepts-exact .coverage.stress-opaque-total-rejects-one-over .coverage.package

      - name: Generate combined coverage XML
        run: python -m coverage xml -o coverage.xml

      - name: Report combined coverage
        run: python -m coverage report --skip-covered

      - name: Normalize coverage filenames for Codecov
        run: python scripts/tooling_coverage.py coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true

  # #702 slice 2: the docs-only fast path's own real test + Codecov-upload
  # body. Runs ONLY when `classify` resolved `docs-only`; the docs-fastpath
  # re-verification step (ci_docs_fastpath_verify.py) independently re-derives
  # the same verdict from this job's own checkout before anything else here
  # is trusted, so a stale/wrong classify output cannot become authoritative
  # on its own word.
  docs-fastpath:
    name: Docs fast path (docs tests + Codecov upload)
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.mode == 'docs-only'
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"

      # Deliberately minimal: no coffee-roaster-mcp, no PortAudio, no
      # Playwright, no build tooling, never `--group dev` (pyproject.toml's
      # `docs-ci` dependency-group docstring explains why).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group docs-ci

      - name: Independently re-verify the docs-only verdict
        run: >-
          python scripts/ci_docs_fastpath_verify.py
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"

      - name: Whitespace/diff validation
        run: >-
          git diff --check
          "$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          "${{ github.event.pull_request.head.sha }}"

      # Explicit file arguments (not a bare `-m` over the whole `tests/`
      # tree) are load-bearing here, confirmed live in a from-scratch
      # external venv installed with only the `docs-ci` group: pytest always
      # eagerly collects every module under `testpaths`, so a module the
      # marker filter would deselect (e.g. tests/test_advisor.py's optional
      # `anthropic` import) still aborts collection before the `-m` filter
      # ever applies. Scoping to exactly the modules governed by
      # scripts/docs_reader_governance.py (tests/test_pytest_governance.py's
      # `governed_modules`) avoids every such unrelated collection error
      # without installing anything beyond the demonstrated `docs-ci` set.
      - name: Documentation-behaviour and fast-path-tooling tests
        env:
          COVERAGE_FILE: .coverage.docs-fastpath
        run: >-
          env -u OPENROUTER_API_KEY python -m pytest
          -m "(docs or docs_ci) and not stress"
          tests/test_agent_model_pins.py
          tests/test_agent_worktree_controls.py
          tests/test_capture_agent_usage.py
          tests/test_config.py
          tests/test_worktree_gate_recipe.py
          tests/test_ci_change_classifier.py
          tests/test_ci_gate_result.py
          tests/test_ci_docs_fastpath_verify.py
          tests/test_pytest_governance.py
          --cov=scripts --cov=.agents/skills/capture-agent-usage/scripts
          --cov-report=xml:coverage.xml

      - name: Normalize coverage filenames for Codecov
        run: python scripts/tooling_coverage.py coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true

  # The tiny, stdlib-only required-check gate: it inherits `contents: read`,
  # runs on every PR/push regardless of mode (`if: always()`), and delegates
  # every fail-closed decision to ci_gate_result.py — no `${{` expression
  # appears in its `run:` line (tests/test_pytest_governance.py:298 asserts
  # this), only static job-id strings; the real values arrive through env.
  checks:
    name: Checks
    if: always()
    runs-on: ubuntu-latest
    needs: [classify, quality, pytest-ordinary, pytest-serial, pytest-stress, package, coverage, docs-fastpath]
    timeout-minutes: 10
    steps:
      - name: Check out trusted gate authority
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: .ci-gate-base
          fetch-depth: 1
          persist-credentials: false

      - name: Require every job to match its declared mode-conditional state
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          MODE: ${{ needs.classify.outputs.mode }}
        run: >-
          python3 .ci-gate-base/scripts/ci_gate_result.py
          --always classify
          --full-only quality --full-only pytest-ordinary --full-only pytest-serial
          --full-only pytest-stress --full-only package --full-only coverage
          --docs-only docs-fastpath

  # The web-unit worker: unchanged body, moved byte-for-byte from the
  # pre-split `web` job. Skipped on a docs-only PR.
  web-unit-worker:
    name: Web worker (lint + typecheck + unit)
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.mode != 'docs-only'
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit + component tests (with coverage gate)
        # The coverage thresholds (vitest.config.ts) gate the foundation logic so
        # S3/S4/S5 inherit a floor — closing the gap that hid the untested live
        # SSE/reducer/query paths the pages ride on.
        run: npm run test:coverage

  # The tiny required-check gate for the web-unit worker.
  web:
    name: Web (lint + typecheck + unit)
    if: always()
    runs-on: ubuntu-latest
    needs: [classify, web-unit-worker]
    timeout-minutes: 10
    steps:
      - name: Check out trusted gate authority
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: .ci-gate-base
          fetch-depth: 1
          persist-credentials: false

      - name: Require the web-unit worker to match its declared mode-conditional state
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          MODE: ${{ needs.classify.outputs.mode }}
        run: >-
          python3 .ci-gate-base/scripts/ci_gate_result.py
          --always classify
          --full-only web-unit-worker

  # The D24/D26 visual gate worker: unchanged body, moved byte-for-byte from
  # the pre-split `web-snapshots` job (including the GHCR mirror pin comment
  # below). Skipped on a docs-only PR.
  #
  # The D24/D26 visual gate: the scripted toHaveScreenshot() snapshot suite, run
  # INSIDE the pinned Playwright Linux image so its pixels match the committed
  # baselines (which are generated in this same image — see the web-snapshots-update
  # workflow, the canonical producer). Local macOS/system-Chrome pixels drift — they
  # are for the /capture skill + ui-reviewer only, not this gate. D26: the uPlot
  # canvas is UN-MASKED (the chart is in every shot); the window.__chart data-assert
  # stays as the authoritative correctness layer alongside the pixels.
  #
  # The suite drives the REAL replay harness (E10-S1): one webServer is the agent
  # in `--replay <fixture> --step` mode (REST + SSE + the gated step routes), the
  # other is the built SPA proxying /api to it. So the container needs BOTH Python
  # (the agent) and Node (Playwright). Replay mode never spawns the MCP child, so
  # no libportaudio2 / sounddevice is needed here (unlike the Python `checks` job).
  web-snapshots-worker:
    name: Web worker (Playwright snapshots)
    runs-on: ubuntu-latest
    needs: [classify, web-unit-worker]
    if: needs.classify.outputs.mode != 'docs-only'
    timeout-minutes: 40
    # packages: read lets the container pull the GHCR-mirrored Playwright image
    # with the built-in GITHUB_TOKEN (#262). contents: read is the checkout floor.
    permissions:
      contents: read
      packages: read
    container:
      # GHCR mirror of mcr.microsoft.com/playwright (#262): MCR rate-limits
      # anonymous pulls from shared-runner IPs and fails this REQUIRED gate.
      # The mirror-playwright.yml workflow keeps this ref in sync — bump the
      # v1.55.1-noble pin together with mirror-playwright.yml,
      # web-snapshots-update.yml, and the @playwright/test version in web/package.json.
      image: ghcr.io/${{ github.repository }}/playwright:v1.55.1-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Set up Python (for the replay-harness webServer)
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install the agent (replay harness — no MCP/audio needed)
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build SPA
        working-directory: web
        run: npm run build

      - name: Run snapshot + e2e suite
        working-directory: web
        # Per-fixture webServer pairs (Playwright-managed): one agent in --replay
        # --step mode + one built-SPA preview per fixture (session-2/session-1/
        # fault-pre-t0) on distinct ports. The suite asserts the whole page INCLUDING
        # the un-masked uPlot canvas (D26) + the window.__chart data hook + the
        # real-replay SSE smoke against committed Linux baselines.
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # The tiny required-check gate for the Playwright-snapshots worker.
  web-snapshots:
    name: Web (Playwright snapshots)
    if: always()
    runs-on: ubuntu-latest
    needs: [classify, web-snapshots-worker]
    timeout-minutes: 10
    steps:
      - name: Check out trusted gate authority
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: .ci-gate-base
          fetch-depth: 1
          persist-credentials: false

      - name: Require the Playwright-snapshots worker to match its declared mode-conditional state
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          MODE: ${{ needs.classify.outputs.mode }}
        run: >-
          python3 .ci-gate-base/scripts/ci_gate_result.py
          --always classify
          --full-only web-snapshots-worker
