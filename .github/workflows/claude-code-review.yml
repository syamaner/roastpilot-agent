name: Claude Code Review

on:
  pull_request:
    # Base retargeting can expand the effective diff without changing the head
    # SHA. The job-level condition below ignores title/body-only edits.
    types: [opened, synchronize, ready_for_review, reopened, edited]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# #579: without this, a rapid sequence of pushes to the same PR can leave an
# OLDER review run still posting inline threads after a newer push has
# already changed the diff those threads referenced — stale findings against
# code that no longer exists. Scoped per-PR (not per-ref/per-SHA) so a new
# push cancels the prior push's still-running review, not just a literal
# re-run of the identical commit.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip Dependabot PRs: GitHub withholds repository secrets from Dependabot
    # `pull_request` runs (read-only token), so CLAUDE_CODE_OAUTH_TOKEN is empty
    # and the action fails. Dependency bumps don't need a Claude code review —
    # CI + codecov cover them. (claude-review is not a required check, so a
    # Dependabot PR is never blocked; this just removes the spurious red X.)
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from != '')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # #579: without this, claude-code-action's prepareAgentMode() calls
          # configureGitAuth(), which embeds this job's OAuth-derived
          # credential directly into .git/config's remote URL — readable on
          # disk by anything this job's tool policy allows to read files,
          # i.e. a real exfiltration path for a token this job should never
          # need to write with at all (it only reviews and posts inline
          # comments, never pushes). Setting `use_commit_signing: true` makes
          # claude-code-action skip configureGitAuth() entirely. Posting
          # inline findings is unaffected: that goes through the separate
          # `mcp__github_inline_comment` server, authenticated from the
          # job's own token via the environment, not through git or
          # .git/config at all.
          use_commit_signing: true
          # #579: `--comment` runs the review under the plugin's own
          # tag-mode permission profile, which defaults to `acceptEdits` —
          # auto-confirming any edit/write/commit tool call rather than
          # requiring interactive approval. This job only ever needs to READ
          # the diff and POST inline review comments; it has no legitimate
          # reason to touch the working tree, the git history, or delete
          # anything, so deny every edit/write/commit-adjacent tool
          # explicitly rather than relying on the plugin's default profile
          # to stay conservative forever. Deny rules win over acceptEdits
          # and the tag mode's own allow list.
          #
          # CRITICAL (#579 root cause): claude-code-action's own
          # `install-mcp-server.ts::prepareMcpConfig` only installs the
          # `github_inline_comment` MCP server when `claude_args` contains
          # an `--allowedTools` entry starting with
          # `mcp__github_inline_comment__` (matches the action's own
          # canonical `examples/pr-review-comprehensive.yml`) — without that
          # allowlist entry, findings silently degrade to a `gh pr comment`
          # summary instead of the resolvable inline threads
          # `required_conversation_resolution` actually gates merge on, and
          # Codex was left as the sole inline gate (see #579). `--allowedTools`
          # and `--disallowedTools` coexist safely here: deny still wins over
          # allow (and over acceptEdits) for every write/commit-adjacent
          # tool, so granting the inline-comment server and a few read-only
          # `gh pr` Bash forms doesn't reopen the write blast radius the deny
          # list closes.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files,Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git push:*)"
          # Agent-authored PRs advance via the `claude` GitHub App, so the
          # synchronize event's actor is `claude[bot]`; the action rejects
          # non-human actors unless allowlisted, leaving a permanent red X (and
          # zero Claude review coverage) on every agent PR. Allowlist `claude`
          # explicitly (both suffix forms, robust to actor normalization) —
          # NOT `*`, so arbitrary third-party bots still can't trigger a review
          # that holds the repo's read-only secret. Dependabot stays excluded by
          # the job-level `if` above (its runs have no secret anyway).
          allowed_bots: 'claude,claude[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Always post a visible tracking comment, even when the review has
          # no findings — a clean review must be distinguishable from a
          # silently failed one. Note: use_sticky_comment would be the
          # obvious choice but has no effect in agent mode (custom prompt);
          # see anthropics/claude-code-action#1108.
          track_progress: true
          # --comment posts each finding as an INLINE PR review comment (a
          # resolvable thread), not just one summary issue comment. Combined
          # with the `required_conversation_resolution` branch-protection rule
          # on main, every finding then BLOCKS merge until its thread is
          # explicitly resolved — i.e. a "needs change" comment can't be merged
          # past without conscious triage. (A summary issue comment is not a
          # resolvable thread and does not block; that was the gap on #143.)
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
