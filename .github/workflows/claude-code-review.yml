name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Always post a visible tracking comment, even when the review has
          # no findings — a clean review must be distinguishable from a
          # silently failed one. Note: use_sticky_comment would be the
          # obvious choice but has no effect in agent mode (custom prompt);
          # see anthropics/claude-code-action#1108.
          track_progress: true
          # --comment posts each finding as an INLINE PR review comment (a
          # resolvable thread), not just one summary issue comment. Combined
          # with the `required_conversation_resolution` branch-protection rule
          # on main, every finding then BLOCKS merge until its thread is
          # explicitly resolved — i.e. a "needs change" comment can't be merged
          # past without conscious triage. (A summary issue comment is not a
          # resolvable thread and does not block; that was the gap on #143.)
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

