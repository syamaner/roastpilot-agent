name: Claude review approval
on:
  workflow_run:
    workflows: ["Claude Code Review"]
    types: [in_progress, completed]
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
  actions: write
jobs:
  approve:
    name: Publish PR-scoped Claude approval
    if: >-
      github.event_name == 'workflow_run' ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # LOAD-BEARING: never execute untrusted PR code on privileged events.
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Approve reviewed or explicitly exempt PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/claude_review_approval.py
