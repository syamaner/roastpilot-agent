name: CI1039 Linux collection only NONREQUIRED
'on':
  push:
    branches:
    - codex/ci1039-linux-collection-2eab1ae062e6
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ac1108c163865503a384d5601bc1bb123abfa33c
      CANDIDATE_SHA: cae541b69a7576804a1bc34bf1a4dae0fd423dbf
    steps:
    - name: Check out literal baseline
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ac1108c163865503a384d5601bc1bb123abfa33c
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.11'
        cache: pip
    - name: Install declared system libraries
      run: sudo apt-get update && sudo apt-get install -y libportaudio2
    - name: Install declared unchanged dependencies
      run: 'python -m pip install --upgrade pip

        python -m pip install -e . --group dev

        '
    - name: Prepare external collection-only observer
      run: "python - <<'PYCODE'\nimport os,base64,hashlib\nfrom pathlib import Path\nr=Path(os.environ['RUNNER_TEMP'])/'ci1039-collection';r.mkdir();(r/'rp_ci1039_collection.py').write_bytes(base64.b64decode(''))\n\
        out=Path(os.environ['RUNNER_TEMP'])/'ci1039-linux-oracles';out.mkdir()\nwith Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8')as\
        \ f:\n f.write('COLLECTION_OUTPUT='+str(out)+'\\n');f.write('COLLECTION_PLUGIN_ROOT='+str(r)+'\\n');f.write('FROZEN_PROJECT_METADATA_SHA='+hashlib.sha256(Path('pyproject.toml').read_bytes()).hexdigest()+'\\\
        n')\nPYCODE\n"
    - name: Verify baseline imports and unchanged metadata
      run: 'python - <<''PYCODE''

        import os,hashlib,subprocess

        from pathlib import Path

        import roastpilot_agent

        assert Path(roastpilot_agent.__file__).resolve().is_relative_to(Path.cwd()/''src'')

        assert hashlib.sha256(Path(''pyproject.toml'').read_bytes()).hexdigest()==os.environ[''FROZEN_PROJECT_METADATA_SHA'']

        subprocess.run([''python'',''-m'',''pip'',''check''],check=True)

        PYCODE

        '
    - name: Collect baseline IDs without executing tests
      env:
        COLLECTION_PHASE: B
      run: 'set -e

        export PYTHONPATH="$COLLECTION_PLUGIN_ROOT"

        unset PYTEST_ADDOPTS PYTEST_PLUGINS PYTEST_DISABLE_PLUGIN_AUTOLOAD COVERAGE_PROCESS_START

        python -m pytest --collect-only -q --no-cov -p rp_ci1039_collection -m "not serial and not stress" --ignore=tests/test_packaging.py
        -o cache_dir="$RUNNER_TEMP/ci1039-collection-cache"

        '
    - name: Check out literal candidate
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: cae541b69a7576804a1bc34bf1a4dae0fd423dbf
        persist-credentials: false
    - name: Verify candidate imports and unchanged metadata
      run: 'python - <<''PYCODE''

        import os,hashlib,subprocess

        from pathlib import Path

        import roastpilot_agent

        assert Path(roastpilot_agent.__file__).resolve().is_relative_to(Path.cwd()/''src'')

        assert hashlib.sha256(Path(''pyproject.toml'').read_bytes()).hexdigest()==os.environ[''FROZEN_PROJECT_METADATA_SHA'']

        subprocess.run([''python'',''-m'',''pip'',''check''],check=True)

        PYCODE

        '
    - name: Collect candidate IDs without executing tests
      env:
        COLLECTION_PHASE: C
      run: 'set -e

        export PYTHONPATH="$COLLECTION_PLUGIN_ROOT"

        unset PYTEST_ADDOPTS PYTEST_PLUGINS PYTEST_DISABLE_PLUGIN_AUTOLOAD COVERAGE_PROCESS_START

        python -m pytest --collect-only -q --no-cov -p rp_ci1039_collection -m "not serial and not stress" --ignore=tests/test_packaging.py
        -o cache_dir="$RUNNER_TEMP/ci1039-collection-cache"

        '
    - name: Publish both Linux collection lists
      uses: actions/upload-artifact@v4
      with:
        name: linux-collection-oracles
        path: ${{ runner.temp }}/ci1039-linux-oracles/
        if-no-files-found: error
        retention-days: 7
