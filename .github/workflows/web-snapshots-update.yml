name: Web snapshots — update baselines

# The canonical PRODUCER of the committed Playwright PNG baselines (D26).
#
# Baselines are a CI-Docker-only artifact: generated + diffed ONLY inside the
# pinned amd64 Playwright image, NEVER on a dev machine (macOS pixels drift and
# would poison the gate — see web/tests/e2e/README.md). This job runs
# `playwright test --update-snapshots` inside that SAME pinned image the gate uses
# (the `web-snapshots` job in ci.yml), then commits the regenerated
# `__screenshots__/**/*-linux.png` back to the branch it was dispatched on.
#
# Trigger it from the Actions tab on your feature branch whenever a UI change moves
# the pixels. It is manual-only (`workflow_dispatch`) so baselines never silently
# regenerate on a normal push/PR — the gate (ci.yml) must stay an independent check.
on:
  workflow_dispatch:

permissions:
  contents: write
  # packages: read lets the container pull the GHCR-mirrored Playwright image
  # with the built-in GITHUB_TOKEN (#262). contents: write stays for the
  # baseline commit + push below — do not remove it.
  packages: read

concurrency:
  group: web-snapshots-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-baselines:
    name: Regenerate + commit Playwright baselines
    runs-on: ubuntu-latest
    # The SAME GHCR-mirrored image as the ci.yml `web-snapshots` gate (#262):
    # MCR rate-limits anonymous pulls. The mirror-playwright.yml workflow keeps
    # this ref in sync — bump the v1.55.1-noble pin together with
    # mirror-playwright.yml, ci.yml, and the @playwright/test / playwright-core
    # versions in web/package.json.
    container:
      image: ghcr.io/${{ github.repository }}/playwright:v1.55.1-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the dispatched branch
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Set up Python (for the replay-harness webServers)
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install the agent (replay harness — no MCP/audio needed)
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build SPA
        working-directory: web
        run: npm run build

      - name: Regenerate all baselines inside the pinned image
        working-directory: web
        # --update-snapshots rewrites every committed *-linux.png from this image's
        # pixels (the only environment the gate trusts).
        run: npx playwright test --update-snapshots

      - name: Commit + push regenerated baselines (if any changed)
        run: |
          # Mark the checkout safe FIRST. The container runs as root over a mount
          # owned by a different uid; until git trusts the dir, even a *local*
          # `git config` write fails with "fatal: not in a git directory" (exit
          # 128) — which is what silently broke this producer. This must precede
          # every other git command.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage first, THEN check the staged diff. `git diff --quiet` (working
          # tree) does not see brand-new untracked files, so a NEW spec's first-
          # ever baselines would be silently dropped (the bug that left
          # mic-status.spec.ts without baselines). `git add` + `--cached` catches
          # both modified and newly-added PNGs.
          git add web/tests/e2e/__screenshots__
          if git diff --cached --quiet -- web/tests/e2e/__screenshots__; then
            echo "No baseline changes — nothing to commit."
            exit 0
          fi
          git commit -m "ci: regenerate Playwright baselines in pinned image [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
