[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "roastpilot-agent"
dynamic = ["version"]
description = "RoastPilot Agent: deterministic agent harness for autonomous coffee roasting — the controller owns the loop, the LLM advises."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Sertan Yamaner" }
]
maintainers = [
  { name = "Sertan Yamaner" }
]
keywords = [
  "agent",
  "autonomous-roasting",
  "coffee",
  "coffee-roasting",
  "mcp",
  "model-context-protocol",
  "pydantic-ai",
  "roastpilot"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Hardware",
  "Typing :: Typed"
]
dependencies = [
  "aiosqlite>=0.22,<1",
  # #484: the MCP stdio transport (mcp / stdio_client) is built on anyio, and
  # the fail-closed stop() teardown contract is validated against anyio's
  # BrokenResourceError / ClosedResourceError (a raising aclose after a child
  # segfault). Previously transitive via mcp; now referenced directly in the
  # teardown tests, so declare it explicitly (mirrors the pyserial/sounddevice
  # transitive-turned-direct precedent below).
  "anyio>=4.0,<5",
  "fastapi>=0.136,<1",
  # #591's connect-time backend hook is verified against HTTPX 0.28's
  # AsyncHTTPTransport pool surface; widen only with the transport tests.
  "httpx>=0.28,<0.29",
  # #591: bean sourcing wraps httpcore's public AsyncNetworkBackend so DNS
  # validation and IP pinning happen at the actual TCP connect boundary while
  # HTTPX retains hostname URL/cookie/SNI semantics. It was already transitive
  # via httpx; direct runtime use makes the dependency explicit.
  "httpcore>=1.0,<1.1",
  # D121 catalogue discovery imports lxml directly for bounded HTML parsing;
  # declare the runtime requirement instead of relying on sourcing transitive deps.
  "lxml>=5.0,<7",
  "mcp>=1.0.0,<2",
  "pydantic>=2.10,<3",
  # D18: the lean core covers the default openai_compatible path (OpenRouter
  # via base_url), Ollama (OpenAI-compatible), and the native openai
  # provider. Native anthropic/google are optional extras below.
  "pydantic-ai-slim[openai]>=1.0,<2",
  "pydantic-settings>=2.7,<3",
  # D78: saved-config file persistence (config_store.py). PyYAML is used for
  # reading / writing the operator's saved-config file; filelock serialises
  # concurrent PUT /api/config calls (TOCTOU guard — PR b).  Both are direct
  # runtime deps (not transitive) so we declare them explicitly.
  "filelock>=3.16,<4",
  "pyyaml>=6.0,<7",
  # D78 PR(c): device enumeration for GET /api/config/devices. Both were
  # previously transitive (via coffee-roaster-mcp); now imported directly in
  # api.py so they must be declared as explicit runtime deps.
  "pyserial>=3.5,<4",
  "sounddevice>=0.5,<1",
  "uvicorn>=0.34,<1",
  "webencodings>=0.5.1,<1",
  # #590 slice B: deterministic JSON-LD product extraction ahead of the
  # bean-sourcing LLM call (bean_sourcing._build_json_ld_context). Pinned to
  # the 0.18 surface this module calls (extruct.extract(..., syntaxes=
  # ["json-ld"])); restricted to the JSON-LD syntax only — see
  # bean_sourcing._parse_html_for_json_ld's docstring for why
  # microdata/RDFa are deliberately not used here (XXE-safety boundary).
  # Pulls a fairly heavy transitive set (lxml, rdflib, pyrdfa3, mf2py,
  # w3lib, html-text, jstyleson) because extruct's package __init__ eagerly
  # imports every syntax module regardless of which ``syntaxes`` a caller
  # requests at runtime — accepted for the extraction quality this buys
  # (docs/research/bean-sourcing/README.md §2).
  "extruct>=0.18,<0.19",
  # #601 fold round 9, E FOLD 2: previously transitive via
  # pydantic-ai-slim[openai] (>=2.29.0); now imported directly
  # (bean_sourcing._extract_bean_identity closes the bespoke,
  # retry-disabled AsyncOpenAI client it builds; advisor.build_model
  # constructs it) so it is a direct dep, same precedent as
  # pyserial/sounddevice/anyio above.
  "openai>=2.29.0,<3",
  # #590 slice C: boilerplate-stripped markdown preprocessing ahead of the
  # bean-sourcing LLM call (bean_sourcing._extract_page_markdown) — ~65%
  # fewer tokens and nav/footer/related-products stripped so a page's
  # product specs survive the character cap instead of being lost behind
  # boilerplate (docs/research/bean-sourcing/README.md §2). Shares lxml
  # with ``extruct`` above. Pinned to the 2.1 surface this module calls
  # (``trafilatura.extract(..., output_format="markdown")``); its own HTML
  # parser (``lxml.html.HTMLParser``, HTML mode) never expands DTD entities
  # and defaults to ``no_network=True`` — verified empirically (an XXE/DTD
  # payload comes through inert, no outbound connection attempted) — see
  # bean_sourcing._extract_page_markdown's docstring. Pulls courlan,
  # htmldate, justext, dateparser (+ babel/pytz/tzlocal/tld) — trafilatura's
  # own dependency set, accepted for the extraction-quality win.
  "trafilatura>=2.1,<3"
]

# D18 native-provider extras: install only what your configured
# AdvisorConfig.provider needs. openai_compatible / ollama / openai work
# with the lean core; anthropic and google each pull their SDK.
#   provider="anthropic"  -> pip install roastpilot-agent[anthropic]
#   provider="google"     -> pip install roastpilot-agent[google]
[project.optional-dependencies]
anthropic = ["pydantic-ai-slim[anthropic]>=1.0,<2"]
google = ["pydantic-ai-slim[google]>=1.0,<2"]
all-providers = [
  "pydantic-ai-slim[anthropic]>=1.0,<2",
  "pydantic-ai-slim[google]>=1.0,<2"
]

[project.urls]
Homepage = "https://github.com/syamaner/roastpilot-agent"
Documentation = "https://github.com/syamaner/roastpilot-agent#readme"
Repository = "https://github.com/syamaner/roastpilot-agent"
Issues = "https://github.com/syamaner/roastpilot-agent/issues"
"MCP Server" = "https://github.com/syamaner/coffee-roaster-mcp"
"First-Crack Model" = "https://huggingface.co/syamaner/coffee-first-crack-detection"

[project.scripts]
roastpilot-agent = "roastpilot_agent.cli:main"

[dependency-groups]
dev = [
  # Pinned exactly (not >=) so local == CI (#102). The `pyright` PyPI package
  # is a thin wrapper that, by default, downloads the matching pyright node
  # binary at run time — so the wrapper version is the typeshed/checker
  # version. With `>=`, a fresh CI install resolved a newer wrapper (1.1.410)
  # than a stale local env (1.1.408); the newer typeshed flagged
  # `@asynccontextmanager -> AsyncIterator[None]` as reportDeprecated, so a PR
  # passed locally but failed CI. Exact-pin both ends; bump deliberately.
  "pyright==1.1.410",
  "pytest>=8.0",
  "pytest-asyncio>=1.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  # E11-S1 (#137): tests/test_packaging.py builds the real wheel via
  # `python -m build --wheel` to prove the SPA-bundling hook end to end. `build`
  # must be declared here (not ad-hoc pip-installed inside the test) so the
  # test suite is hermetic after `pip install -e . --group dev` (Codex catch,
  # PR #547).
  "build>=1.2",
  # Native-provider SDKs so the full build_model factory (every provider
  # value) is exercised in CI, while the runtime install stays lean.
  "pydantic-ai-slim[anthropic]>=1.0,<2",
  "pydantic-ai-slim[google]>=1.0,<2",
  # The real MCP server, spawned as a stdio child in mock-driver mode for the
  # E9-S2 vertical slice (D6). Pinned to the 0.1.7 surface the mcp_client
  # mirrors + contract fixtures validate against (bumped from 0.1.3: 0.1.4 added
  # the `mic-check` CLI, 0.1.5 makes a transient mic input overflow recoverable
  # instead of fatally killing FC detection — coffee-roaster-mcp#160; 0.1.6
  # adds the drum-drop fix — coffee-roaster-mcp#163 — and fixes the
  # end-of-roast audio-teardown use-after-free that segfaulted the server on
  # shutdown — coffee-roaster-mcp#165; 0.1.7 BACKDATES the T0/FC event
  # timestamps to the turning-point / crack-onset instant and adds the
  # `turning_point_monotonic_seconds` / `confirmed_at_monotonic_seconds` /
  # `confirmed_at_utc` payload fields — coffee-roaster-mcp#169/#170, consumed
  # agent-side by #337; 0.1.8 quiets the MCP SDK's per-request INFO flood
  # during a live roast (raises `mcp.server.lowlevel.server` to WARNING only
  # when more verbose, never lowering a stricter setting) — coffee-roaster-mcp#162,
  # observability-only. 0.1.9 adds per-window FC confidence observability
  # (fc_window log rows + a first_crack_detection summary block — #175),
  # config-driven roast audio capture (mono + multi-device + record-check —
  # #176), and the 14th tool `set_recording_metadata(origin, roast_num)` (the
  # FIRST tool-surface change since the 13-tool baseline; mirrored in
  # mcp_client + contract fixtures). 0.1.10 fixes two recording-path bugs found on
  # roast 5/6 (no tool/contract change, so the 14-tool mirror is unchanged): #180
  # (the multi-device WAV flush packed PCM16 one sample at a time in a Python loop
  # on the detector's read worker → starved FC detection → mic overflow; now
  # numpy-vectorised) and #162 (the per-request SDK INFO flood regression: the
  # quiet guard ran before logging was configured; now `getEffectiveLevel() <=
  # WARNING`). 0.1.11 makes recordings span the full roast — the recorder no
  # longer dies at FC, it finalises at session stop (#181, so the post-FC crack
  # series + the negative-class training data are captured) — and adds live
  # in-session mic peak/RMS dBFS on the FirstCrackStatus readout (#178). Both
  # are agent-tolerated (the new mic_*_dbfs fields are extra="ignore" in the
  # mirror; 14-tool surface unchanged). 0.1.12 adds `ambient_status` to
  # `get_roast_state`'s session state (#342, D85) — read-only corpus metadata
  # (temperature_c/humidity_percent/pressure_hpa from an optional Yoctopuce
  # probe), mirrored byte-for-byte in mcp_client.AmbientStatus; no tool-surface
  # change, hardware-validated on a live read (28.49 C / 38.6% / 1008.56 hPa).
  # It pulls
  # heavy ML/audio deps
  # (transformers/onnxruntime/sounddevice) that mock mode never activates;
  # CI installs libportaudio2 for sounddevice's import.
  "coffee-roaster-mcp==0.1.13",
  # Analysis-harness numeric core (scripts/curve_feature_eval.py, #229). numpy
  # is already present transitively (via the MCP server's ML stack), but the
  # curve-feature analysis imports it directly, so declare it explicitly here:
  # it is a dev/analysis tool, never a runtime dependency of the lean agent.
  "numpy>=1.26"
]

[tool.hatch.build.targets.wheel]
packages = ["src/roastpilot_agent"]

# E11-S1 (#137): bundle the built SPA (web/dist) into the wheel via a custom
# build hook rather than committing web/dist to the repo (the plan §11
# fallback) — see hatch_build.py's module docstring for the full rationale.
# Editable installs (`pip install -e .`) skip the hook entirely and rely on
# the source-checkout fallback in live.default_spa_dir. Scoped to the WHEEL
# target only (not [tool.hatch.build.hooks.custom], which would also fire for
# the sdist build and demand Node for a target that is deliberately
# source-only — Codex catch, PR #547): `python -m build --sdist` must succeed
# with no Node/npm involvement at all.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# The sdist must carry web/ (source, not the built dist) so a
# `pip install roastpilot-agent` sdist fallback (no prebuilt wheel for the
# platform) can still run the build hook.
include = ["src", "web", "hatch_build.py"]
exclude = ["web/node_modules", "web/dist"]

[tool.hatch.version]
path = "src/roastpilot_agent/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --durations=25 --durations-min=1.0"
pythonpath = ["src", "scripts", ".agents/skills/capture-agent-usage/scripts"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: spawns a real subprocess / initialises a real MCP session (still hardware-free)",
    "stress: production-size resource-bound regression: exercises a real production limit (bytes, counts, corpus) at its real value; slow by construction; ALWAYS runs in CI (in the full gate now, in a dedicated lane after slice 2); locally deselectable with `-m 'not stress'`.",
    "serial: must not run concurrently with any other test: mutates a shared repository path, drives real process groups / a real MCP child, or depends on process-global state; runs in the serial lane after slice 2. Reason is stated at the marker site.",
]

[tool.coverage.run]
branch = true
source = ["roastpilot_agent", "scripts", ".agents/skills/capture-agent-usage/scripts"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests", "scripts", ".agents/skills/capture-agent-usage/scripts"]
# The manual bake-off / smoke scripts import each other (``advisor_bakeoff``
# imports ``advisor_smoke``) and the tests that drive the harness import it the
# same way, both by adding ``scripts`` to ``sys.path`` at runtime. Mirror that
# for the type checker so the harness and its tests are strict-checked.
extraPaths = ["scripts", ".agents/skills/capture-agent-usage/scripts"]
venvPath = "."
venv = ".venv"
